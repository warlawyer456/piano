<!DOCTYPE html>  
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass-Synthesia Piano Learning App</title>
    <style>
        :root {
            --bg-color: #0f1020;
            --panel-bg: rgba(25, 27, 48, 0.65);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --left-hand: #ec4899;
            --right-hand: #38bdf8;
            --key-white-bg: #f8fafc;
            --key-black-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-color) 100%);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* --- MENU SCREEN --- */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 16, 32, 0.9);
            backdrop-filter: blur(20px);
            transition: opacity 0.4s ease;
        }

        .menu-container {
            width: 90%;
            max-width: 700px;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
        }

        .menu-container h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-container p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .section-title {
            text-align: left;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .song-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .song-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .mode-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .start-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
        }

        /* --- APP CONTAINER --- */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--panel-border);
            z-index: 10;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--text-secondary);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            background: #4f46e5;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85krem;
            color: var(--text-secondary);
        }

        input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Main Workspace & Split View */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .pane {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: height 0.1s ease;
        }

        #sheet-pane {
            flex: 1;
            background: rgba(15, 16, 32, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sheet-container {
            max-width: 900px;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .sheet-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .sheet-nav {
            position: absolute;
            bottom: 15px;
            right: 25px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .sheet-nav button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 8px;
        }

        .sheet-nav button.active {
            background: var(--accent);
            border-radius: 10px;
        }

        /* Splitter bar */
        #splitter {
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-top: 1px solid var(--panel-border);
            border-bottom: 1px solid var(--panel-border);
            cursor: row-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: background 0.2s;
        }

        #splitter:hover {
            background: var(--accent);
        }

        #splitter::after {
            content: '';
            width: 40px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        /* Waterfall / Synthesia Pane */
        #waterfall-pane {
            flex: 1;
            background: #090a16;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #waterfall-canvas {
            flex: 1;
            width: 100%;
            display: block;
        }

        /* Piano Keyboard UI at bottom */
        .piano-keyboard {
            height: 140px;
            background: #0d0e1b;
            display: flex;
            justify-content: center;
            position: relative;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .key {
            position: relative;
            background: var(--key-white-bg);
            border: 1px solid #cbd5e1;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            font-size: 0.65rem;
            color: #64748b;
            font-weight: 600;
            transition: background 0.1s, box-shadow 0.1s;
        }

        .key.white {
            width: 32px;
            height: 130px;
            z-index: 1;
        }

        .key.black {
            position: absolute;
            width: 20px;
            height: 80px;
            background: var(--key-black-bg);
            border-color: #020617;
            color: #94a3b8;
            z-index: 2;
            border-radius: 0 0 4px 4px;
        }

        .key.active-left {
            background: var(--left-hand) !important;
            color: white !important;
            box-shadow: 0 0 15px var(--left-hand);
        }

        .key.active-right {
            background: var(--right-hand) !important;
            color: white !important;
            box-shadow: 0 0 15px var(--right-hand);
        }

        .key.active-user {
            background: #10b981 !important;
            color: white !important;
            box-shadow: 0 0 15px #10b981;
        }

        /* Status bar / feedback */
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
        }
        .status-badge.active {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <!-- START & SONG MENU -->
    <div id="menu-screen" class="glass">
        <div class="menu-container glass">
            <h1>Synthesia Piano Studio</h1>
            <p>Lerne dein Klavierstück mit flüssiger Wasserfall-Animation, echten Notenblättern und interaktiven Übungstools.</p>
            
            <div class="section-title">1. Stück auswählen</div>
            <div class="song-card" onclick="selectSong(0)">
                <div style="text-align: left;">
                    <div style="font-weight: 600; font-size: 1.05rem;">Klavierstück (Takt 1 – 40)</div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary);">Enthält deine beiden hochgeladenen Notenblätter</div>
                </div>
                <div style="color: var(--accent); font-weight: 600;">Ausgewählt ✓</div>
            </div>

            <div class="section-title">2. Ansichts-Modus wählen</div>
            <div class="mode-grid">
                <button class="mode-btn" onclick="setMode('sheet')" id="btn-mode-sheet">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2m-5 14H7v-2h7v2m3-4H7v-2h10v2m0-4H7V7h10v2Z"/></svg>
                    <span>Nur Noten</span>
                </button>
                <button class="mode-btn active" onclick="setMode('split')" id="btn-mode-split">
                    <svg viewBox="0 0 24 24"><path d="M4 3h16c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2m0 8h16V5H4v6m0 8h16v-6H4v6Z"/></svg>
                    <span>Split (Beides)</span>
                </button>
                <button class="mode-btn" onclick="setMode('waterfall')" id="btn-mode-waterfall">
                    <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2m-9 3h2v5h-2V8m2 7h-2v2h2v-2Z"/></svg>
                    <span>Waterfall Piano</span>
                </button>
            </div>

            <button class="start-btn" onclick="startApp()">Lernen starten 🚀</button>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-container" style="display: none;">
        <!-- Top Control Bar -->
        <header class="glass">
            <div class="controls-left">
                <button class="btn" onclick="openMenu()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    Menü
                </button>
                <button class="btn primary" id="play-btn" onclick="togglePlay()">
                    ▶ Abspielen
                </button>
                <button class="btn" onclick="resetSong()">
                    ⟲ Neustart
                </button>
            </div>

            <div class="controls-right">
                <div class="control-group">
                    <span>Tempo:</span>
                    <input type="range" id="tempo-range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="changeTempo(this.value)">
                    <span id="tempo-val">100%</span>
                </div>
                <div class="control-group">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="wait-mode-check" onchange="toggleWaitMode(this)">
                        Wait-Mode
                    </label>
                </div>
                <div class="status-badge" id="midi-status">MIDI: Inaktiv</div>
            </div>
        </header>

        <!-- Scalable Workspace -->
        <div class="workspace" id="workspace">
            <!-- Sheet Music Pane -->
            <div class="pane" id="sheet-pane">
                <div class="sheet-container">
                    <img id="sheet-img" src="image.png" alt="Notenblatt Seite 1">
                    <div class="sheet-nav">
                        <button class="active" onclick="setSheetPage(1)" id="page-btn-1">Seite 1</button>
                        <button onclick="setSheetPage(2)" id="page-btn-2">Seite 2</button>
                    </div>
                </div>
            </div>

            <!-- Resizable Splitter Divider -->
            <div id="splitter"></div>

            <!-- Waterfall / Synthesia Pane -->
            <div class="pane" id="waterfall-pane">
                <canvas id="waterfall-canvas"></canvas>
                <div class="piano-keyboard" id="keyboard"></div>
            </div>
        </div>
    </div>

    <script>
        /* --- STATE & DATA --- */
        let currentMode = 'split';
        let audioCtx = null;
        let isPlaying = false;
        let playbackTime = 0;
        let songDuration = 16.0; // Sekunden Gesamtdauer
        let playbackSpeed = 1.0;
        let waitMode = false;
        let currentNoteIndex = 0;
        let animationFrameId = null;

        // Notenblätter Bilder URLs (aus den bereitgestellten Daten)
        const sheets = {
            1: "image.png",
            2: "image_2.png"
        };

        // Synthesizer Noten-Daten (Demo-Sequenz passend für das Stück)
        // Jeder Eintrag: { time, note (MIDI), duration, hand ('left'/'right') }
        const songNotes = [
            // Linke Hand Begleitung (C-Moll / g-Moll Skala) & Rechte Melodie
            { time: 0.0, midi: 48, duration: 1.5, hand: 'left' },  // C3
            { time: 0.0, midi: 60, duration: 0.8, hand: 'right' }, // C4
            { time: 0.5, midi: 63, duration: 0.8, hand: 'right' }, // Eb4
            { time: 1.0, midi: 67, duration: 0.8, hand: 'right' }, // G4
            { time: 1.5, midi: 55, duration: 1.5, hand: 'left' },  // G3
            { time: 2.0, midi: 70, duration: 1.2, hand: 'right' }, // Bb4
            { time: 3.0, midi: 48, duration: 1.5, hand: 'left' },  // C3
            { time: 3.2, midi: 68, duration: 0.8, hand: 'right' }, // Ab4
            { time: 4.0, midi: 67, duration: 1.0, hand: 'right' }, // G4
            { time: 5.0, midi: 51, duration: 1.5, hand: 'left' },  // Eb3
            { time: 5.2, midi: 63, duration: 0.8, hand: 'right' }, // Eb4
            { time: 6.0, midi: 65, duration: 0.8, hand: 'right' }, // F4
            { time: 7.0, midi: 48, duration: 1.5, hand: 'left' },  // C3
            { time: 7.2, midi: 67, duration: 1.5, hand: 'right' }, // G4
            { time: 9.0, midi: 55, duration: 1.5, hand: 'left' },  // G3
            { time: 9.5, midi: 70, duration: 1.0, hand: 'right' }, // Bb4
            { time: 11.0, midi: 48, duration: 2.0, hand: 'left' }, // C3
            { time: 11.2, midi: 72, duration: 1.5, hand: 'right' }// C5
        ];

        // Klaviatur Tasten Definition (C3 bis B5 -> 3 Oktaven)
        const minMidi = 48; // C3
        const maxMidi = 83; // B5
        let pianoKeys = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(midiNote, duration = 0.5) {
            initAudio();
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- KEYBOARD SETUP ---
        function buildKeyboard() {
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';
            pianoKeys = [];

            let whiteKeyIndex = 0;
            for (let midi = minMidi; midi <= maxMidi; midi++) {
                const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
                const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                const name = noteNames[midi % 12] + Math.floor(midi / 12 - 1);

                const keyEl = document.createElement('div');
                keyEl.className = `key ${isBlack ? 'black' : 'white'}`;
                keyEl.dataset.midi = midi;
                keyEl.innerHTML = `<span>${name}</span>`;

                keyEl.addEventListener('mousedown', () => {
                    playTone(midi, 0.8);
                    keyEl.classList.add('active-user');
                    setTimeout(() => keyEl.classList.remove('active-user'), 300);
                });

                if (!isBlack) {
                    keyEl.style.left = (whiteKeyIndex * 32) + 'px';
                    kbContainer.appendChild(keyEl);
                    whiteKeyIndex++;
                } else {
                    // Position black key between white keys
                    keyEl.style.left = (whiteKeyIndex * 32 - 10) + 'px';
                    kbContainer.appendChild(keyEl);
                }

                pianoKeys.push({ midi, el: keyEl, isBlack });
            }
            kbContainer.style.width = (whiteKeyIndex * 32) + 'px';
        }

        // --- MENU & MODE LOGIC ---
        function selectSong(index) {
            // Song ausgewählt
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-mode-${mode}`).classList.add('active');
        }

        function startApp() {
            document.getElementById('menu-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                applyModeLayout();
                initCanvas();
            }, 400);
        }

        function openMenu() {
            pausePlayback();
            document.getElementById('menu-screen').style.display = 'flex';
            setTimeout(() => document.getElementById('menu-screen').style.opacity = '1', 10);
        }

        function applyModeLayout() {
            const sheetPane = document.getElementById('sheet-pane');
            const waterfallPane = document.getElementById('waterfall-pane');
            const splitter = document.getElementById('splitter');

            if (currentMode === 'sheet') {
                sheetPane.style.display = 'flex';
                sheetPane.style.height = '100%';
                waterfallPane.style.display = 'none';
                splitter.style.display = 'none';
            } else if (currentMode === 'waterfall') {
                sheetPane.style.display = 'none';
                waterfallPane.style.display = 'flex';
                waterfallPane.style.height = '100%';
                splitter.style.display = 'none';
            } else { // Split
                sheetPane.style.display = 'flex';
                sheetPane.style.height = '50%';
                waterfallPane.style.display = 'flex';
                waterfallPane.style.height = '50%';
                splitter.style.display = 'flex';
            }
            resizeCanvas();
        }

        function setSheetPage(pageNum) {
            document.getElementById('sheet-img').src = sheets[pageNum];
            document.getElementById('page-btn-1').classList.toggle('active', pageNum === 1);
            document.getElementById('page-btn-2').classList.toggle('active', pageNum === 2);
        }

        // --- RESIZABLE SPLIT VIEW LOGIC ---
        const splitter = document.getElementById('splitter');
        let isDragging = false;

        splitter.addEventListener('mousedown', (e) => {
            isDragging = true;
            document.body.style.cursor = 'row-resize';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const workspace = document.getElementById('workspace');
            const rect = workspace.getBoundingClientRect();
            const offsetY = e.clientY - rect.top;
            const percentage = (offsetY / rect.height) * 100;
            
            if (percentage > 15 && percentage < 85) {
                document.getElementById('sheet-pane').style.height = percentage + '%';
                document.getElementById('waterfall-pane.style').height = (100 - percentage) + '%';
                resizeCanvas();
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.style.cursor = 'default';
        });

        // --- WATERFALL CANVAS SYNTHESIA RENDERER ---
        const canvas = document.getElementById('waterfall-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 140; // minus keyboard height
        }

        window.addEventListener('resize', resizeCanvas);

        function getKeyX(midi) {
            // Berechnet X-Koordinate für eine Note auf dem Canvas
            let whiteCountBefore = 0;
            for (let m = minMidi; m < midi; m++) {
                if (![1, 3, 6, 8, 10].includes(m % 12)) whiteCountBefore++;
            }
            const isBlack = [1, 3, 6, 8, 10].includes(midi % 12);
            const keyWidth = canvas.width / 21; // Ca. 21 weiße Tasten in 3 Oktaven

            if (!isBlack) {
                return whiteCountBefore * keyWidth;
            } else {
                return whiteCountBefore * keyWidth - (keyWidth * 0.3);
            }
        }

        function drawWaterfall() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const pianoHeight = 140;
            const targetHeight = canvas.height;
            const pixelsPerSecond = 150; // Fall-Geschwindigkeit

            // Zeichne fallende Noten im Synthesia-Stil
            songNotes.forEach(note => {
                const noteTopTime = note.time;
                const noteBottomTime = note.time + note.duration;

                // Positionen auf dem Canvas berechnen
                const yBottom = targetHeight - ((noteTopTime - playbackTime) * pixelsPerSecond);
                const yTop = targetHeight - ((noteBottomTime - playbackTime) * pixelsPerSecond);

                if (yBottom > 0 && yTop < targetHeight) {
                    const x = getKeyX(note.midi);
                    const width = [1, 3, 6, 8, 10].includes(note.midi % 12) ? (canvas.width / 21) * 0.6 : (canvas.width / 21) * 0.95;
                    const height = Math.max(10, yBottom - yTop);

                    // Farbverlauf für die fallende Note
                    const gradient = ctx.createLinearGradient(x, yTop, x, yBottom);
                    if (note.hand === 'left') {
                        gradient.addColorStop(0, '#f43f5e');
                        gradient.addColorStop(1, '#ec4899');
                    } else {
                        gradient.addColorStop(0, '#0ea5e9');
                        gradient.addColorStop(1, '#38bdf8');
                    }

                    ctx.fillStyle = gradient;
                    ctx.shadowColor = note.hand === 'left' ? '#ec4899' : '#38bdf8';
                    ctx.shadowBlur = 10;
                    
                    // Abgerundete Noten-Balken
                    ctx.beginPath();
                    ctx.roundRect(x, yTop, width, height, 6);
                    ctx.fill();
                    ctx.shadowBlur = 0; // Reset shadow
                }
            });

            // Aktive Tasten prüfen & Audio triggern
            pianoKeys.forEach(k => {
                k.el.classList.remove('active-left', 'active-right');
            });

            songNotes.forEach(note => {
                if (playbackTime >= note.time && playbackTime <= note.time + note.duration) {
                    const keyObj = pianoKeys.find(k => k.midi === note.midi);
                    if (keyObj) {
                        keyObj.el.classList.add(note.hand === 'left' ? 'active-left' : 'active-right');
                    }
                }
            });
        }

        // --- PLAYBACK & LOOP LOOP ---
        function updateLoop() {
            if (!isPlaying) return;

            playbackTime += (0.016) * playbackSpeed;

            if (playbackTime >= songDuration) {
                playbackTime = 0;
                if (waitMode) {
                    pausePlayback();
                }
            }

            drawWaterfall();
            animationFrameId = requestAnimationFrame(updateLoop);
        }

        function togglePlay() {
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlayback();
            }
        }

        function startPlayback() {
            isPlaying = true;
            document.getElementById('play-btn').innerHTML = '⏸ Pausieren';
            initAudio();
            updateLoop();
        }

        function pausePlayback() {
            isPlaying = false;
            document.getElementById('play-btn').innerHTML = '▶ Abspielen';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function resetSong() {
            pausePlayback();
            playbackTime = 0;
            drawWaterfall();
        }

        function changeTempo(val) {
            playbackSpeed = parseFloat(val);
            document.getElementById('tempo-val').innerText = Math.round(playbackSpeed * 100) + '%';
        }

        function toggleWaitMode(checkbox) {
            waitMode = checkbox.checked;
        }

        // --- WEB MIDI API INTEGRATION ---
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        }

        function onMIDISuccess(midiAccess) {
            const statusEl = document.getElementById('midi-status');
            statusEl.innerText = "MIDI: Bereit";
            statusEl.classList.add('active');

            for (let input of midiAccess.inputs.values()) {
                input.onmidimessage = getMIDIMessage;
            }
        }

        function onMIDIFailure() {
            console.log('MIDI konnte nicht geladen werden.');
        }

        function getMIDIMessage(message) {
            const [command, note, velocity] = message.data;
            // Note on
            if (command === 144 && velocity > 0) {
                playTone(note, 0.5);
                const keyObj = pianoKeys.find(k => k.midi === note);
                if (keyObj) {
                    keyObj.el.classList.add('active-user');
                    setTimeout(() => keyObj.el.classList.remove('active-user'), 250);
                }
            }
        }

        // Initialisierung beim Laden
        window.onload = () => {
            buildKeyboard();
            resizeCanvas();
            drawWaterfall();
        };
    </script>
</body>
</html>
